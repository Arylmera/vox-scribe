<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-label="The Vox-Scribe band above Claude Code's prompt: the session is armed, a dictation made from another window is recorded, transcribed and submitted into it">
<style>
text{font-family:"Cascadia Mono","JetBrains Mono",Consolas,Menlo,monospace;font-size:22px}
.loop{animation-duration:9s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.sa{animation-name:sa} .sb{animation-name:sb} .sc{animation-name:sc} .msg{animation-name:msg}
@keyframes sa{0%,28%{opacity:1}30%,78%{opacity:0}80%,100%{opacity:1}}
@keyframes sb{0%,28%{opacity:0}30%,62%{opacity:1}64%,100%{opacity:0}}
@keyframes sc{0%,62%{opacity:0}64%,78%{opacity:1}80%,100%{opacity:0}}
@keyframes msg{0%,79%{opacity:0}83%,95%{opacity:1}99%,100%{opacity:0}}
.bar{transform-box:fill-box;transform-origin:center;animation:wave .9s ease-in-out infinite alternate}
@keyframes wave{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
.dot{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.caret{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style>

<!-- window -->
<rect x="40" y="24" width="1200" height="552" rx="14" fill="#111318" stroke="#2A2E37" stroke-width="2"/>
<circle cx="72" cy="52" r="7" fill="#3A3F4A"/><circle cx="96" cy="52" r="7" fill="#3A3F4A"/><circle cx="120" cy="52" r="7" fill="#3A3F4A"/>
<text x="640" y="59" text-anchor="middle" fill="#6B7280" style="font-size:17px">claude — ~/projects/api</text>
<line x1="40" y1="80" x2="1240" y2="80" stroke="#22262E" stroke-width="2"/>

<!-- conversation -->
<text x="72" y="130" fill="#8B909A">&gt; refactor the auth middleware so tokens are checked once</text>
<text x="72" y="178" fill="#E6E6E6"><tspan fill="#3DDC84">●</tspan> Done — tokens are now validated once per request,</text>
<text x="98" y="210" fill="#E6E6E6">in verifyToken(); the three routes share it.</text>

<g class="loop msg">
  <text x="72" y="262" fill="#6B7280" style="font-size:16px">The voxscribe plugin sent a message</text>
  <text x="72" y="294" fill="#E6E6E6">&gt; ajoute un test pour le cas du token expiré</text>
  <text x="72" y="342" fill="#3DDC84">✻ <tspan fill="#8B909A">Thinking…</tspan></text>
</g>

<!-- chord chip, while dictating -->
<g class="loop sb">
  <rect x="806" y="356" width="410" height="42" rx="21" fill="#1A1D24" stroke="#3A3F4A"/>
  <text x="828" y="384" fill="#C9CCD3" style="font-size:17px">⌨  command chord, held in your browser</text>
</g>

<!-- band: armed -->
<g class="loop sa">
  <rect x="64" y="404" width="196" height="34" rx="6" fill="#0F3721"/>
  <text x="78" y="429" fill="#3DDC84">◉</text>
  <text x="104" y="429" fill="#FFFFFF">Vox · cible</text>
  <text x="290" y="429" fill="#E6E6E6">🎯 désarmer</text>
  <text x="462" y="429" fill="#E6E6E6">🎙 parler</text>
  <text x="608" y="429" fill="#8B909A">🔊 fr</text>
  <text x="704" y="429" fill="#8B909A">🔊 en</text>
</g>

<!-- band: dictating -->
<g class="loop sb">
  <rect x="64" y="404" width="250" height="34" rx="6" fill="#3A1517"/>
  <text class="dot" x="78" y="429" fill="#E5484D">●</text>
  <text x="104" y="429" fill="#FFFFFF">0:04</text>
  <g fill="#3DDC84">
    <rect class="bar" x="178" y="411" width="8" height="20" rx="2"/>
    <rect class="bar" x="194" y="411" width="8" height="20" rx="2" style="animation-delay:-.3s"/>
    <rect class="bar" x="210" y="411" width="8" height="20" rx="2" style="animation-delay:-.6s"/>
    <rect class="bar" x="226" y="411" width="8" height="20" rx="2" style="animation-delay:-.15s"/>
    <rect class="bar" x="242" y="411" width="8" height="20" rx="2" style="animation-delay:-.45s"/>
    <rect class="bar" x="258" y="411" width="8" height="20" rx="2" style="animation-delay:-.75s"/>
    <rect class="bar" x="274" y="411" width="8" height="20" rx="2" style="animation-delay:-.05s"/>
  </g>
  <rect x="338" y="404" width="148" height="34" rx="6" fill="#3DDC84"/>
  <text x="352" y="429" fill="#0B0D10">■ envoyer</text>
  <text x="512" y="429" fill="#8B909A">✕ annuler</text>
</g>

<!-- band: transcribing -->
<g class="loop sc">
  <rect x="64" y="404" width="330" height="34" rx="6" fill="#0F3721"/>
  <text x="78" y="429" fill="#3DDC84">⠂</text>
  <text x="104" y="429" fill="#FFFFFF">Vox · transcription…</text>
</g>

<!-- prompt -->
<rect x="64" y="460" width="1152" height="60" rx="8" fill="none" stroke="#3A3F4A" stroke-width="2"/>
<text x="84" y="498" fill="#8B909A">&gt;</text>
<rect class="caret" x="110" y="478" width="12" height="26" fill="#C9CCD3"/>
<text x="72" y="552" fill="#4B5260" style="font-size:16px">? for shortcuts</text>
</svg>
