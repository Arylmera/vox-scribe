<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Space Grotesk', 'Segoe UI', sans-serif; background: #0a0d12; }
    a { color: #4fd8e8; } a:hover { color: #8ce8f2; }
  </style>
</helmet>
<div style="width: 500px; display: flex; flex-direction: column; gap: 20px; align-items: center; background: radial-gradient(ellipse at 50% -10%, #101722 0%, #0a0d12 60%); padding: 28px 0 32px 0;">

  <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1.5px; color: #8b96a5;">ENREGISTREMENT — verre transparent sur la fenêtre dictée</div>

  <!-- State 1: transparent glass over fake document text, rec lamp + readout, wave, timer -->
  <div style="position: relative; width: 440px; height: 84px; border-radius: 10px; overflow: hidden; background: #e8e6e1; display: flex; align-items: center; justify-content: center;">
    <div style="position: absolute; inset: 12px 18px; display: flex; flex-direction: column; gap: 7px;">
      <div style="height: 8px; width: 82%; border-radius: 4px; background: #b9b5ad;"></div>
      <div style="height: 8px; width: 94%; border-radius: 4px; background: #c6c2ba;"></div>
      <div style="height: 8px; width: 68%; border-radius: 4px; background: #b9b5ad;"></div>
      <div style="height: 8px; width: 88%; border-radius: 4px; background: #c6c2ba;"></div>
    </div>
    <div style="position: relative; width: 380px; height: 60px; background: rgba(12,16,22,0.55); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid {{a35}}; border-radius: 30px; display: flex; align-items: center; gap: 12px; padding: 0 20px; box-shadow: 0 0 24px {{a10}}, 0 12px 32px rgba(0,0,0,0.35);">
      <div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0;">
        <div style="width: 7px; height: 7px; border-radius: 50%; background: #e85656; box-shadow: 0 0 8px rgba(232,86,86,0.7);"></div>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1.5px; color: #cfd6de;">REC · CLEAN</div>
      </div>
      <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 4px; height: 30px;">
        <sc-for list="{{recBars}}" as="b" hint-placeholder-count="14">
          <div style="width: 4px; height: {{b.h}}px; border-radius: 99px; background: {{accent}}; opacity: {{b.o}};"></div>
        </sc-for>
      </div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: {{accent}}; flex-shrink: 0;">0:07</div>
    </div>
  </div>

  <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1.5px; color: #8b96a5; margin-top: 8px;">TRANSCRIPTION · APERÇU — même verre, le texte glisse dessous</div>

  <!-- State 2: lamp off, amber shimmer, preview line; same transparent glass -->
  <div style="position: relative; width: 440px; height: 116px; border-radius: 10px; overflow: hidden; background: #e8e6e1; display: flex; align-items: center; justify-content: center;">
    <div style="position: absolute; inset: 12px 18px; display: flex; flex-direction: column; gap: 7px;">
      <div style="height: 8px; width: 90%; border-radius: 4px; background: #c6c2ba;"></div>
      <div style="height: 8px; width: 76%; border-radius: 4px; background: #b9b5ad;"></div>
      <div style="height: 8px; width: 94%; border-radius: 4px; background: #c6c2ba;"></div>
      <div style="height: 8px; width: 64%; border-radius: 4px; background: #b9b5ad;"></div>
      <div style="height: 8px; width: 86%; border-radius: 4px; background: #c6c2ba;"></div>
      <div style="height: 8px; width: 72%; border-radius: 4px; background: #b9b5ad;"></div>
    </div>
    <div style="position: relative; width: 380px; background: rgba(12,16,22,0.55); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.14); border-radius: 30px; display: flex; flex-direction: column; padding: 10px 20px 12px 20px; box-shadow: 0 12px 32px rgba(0,0,0,0.35);">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0;">
          <div style="width: 7px; height: 7px; border-radius: 50%; background: #3d2426;"></div>
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1.5px; color: #e8b44f;">CLEAN</div>
        </div>
        <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 4px; height: 30px;">
          <sc-for list="{{shimmerBars}}" as="b" hint-placeholder-count="14">
            <div style="width: 4px; height: {{b.h}}px; border-radius: 99px; background: #e8b44f;"></div>
          </sc-for>
        </div>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #cfd6de; flex-shrink: 0;">0:11</div>
      </div>
      <div style="margin: 4px 4px 0 4px; font-size: 13px; color: #f2f5f8; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; -webkit-mask-image: linear-gradient(90deg, transparent 0%, black 12%, black 88%, transparent 100%); mask-image: linear-gradient(90deg, transparent 0%, black 12%, black 88%, transparent 100%);">…et le trajet distant reste prioritaire pour cette session.</div>
    </div>
  </div>

  <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 1px; color: #5a6472; width: 440px; text-align: center;">fond clair simulé = la fenêtre dictée derrière la pastille</div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#4fd8e8","options":["#4fd8e8","#5a8cf5","#4fe8a0","#f06ad8"],"section":"Theme"},"$preview":{"width":500,"height":460}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.accent ?? '#4fd8e8';
    const rec = [], shim = [];
    for (let i = 0; i < 18; i++) {
      const v = Math.abs(Math.sin(i * 0.85 + 1.1)) * (0.4 + 0.6 * Math.abs(Math.sin(i * 0.31)));
      rec.push({ h: Math.round(4 + 26 * v), o: (0.35 + 0.65 * v).toFixed(2) });
      shim.push({ h: Math.round(8 + 7 * Math.sin(i * 0.45)) });
    }
    return { accent: a, a10: a + '1a', a35: a + '59', recBars: rec, shimmerBars: shim };
  }
}
</script>
</body>
</html>
