<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Space Grotesk', 'Segoe UI', sans-serif; background: #0a0d12; }
    a { color: #4fd8e8; } a:hover { color: #8ce8f2; }
  </style>
</helmet>
<div style="width: 500px; display: flex; flex-direction: column; gap: 20px; align-items: center; background: radial-gradient(ellipse at 50% -10%, #101722 0%, #0a0d12 60%); padding: 28px 0 32px 0;">

  <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1.5px; color: #8b96a5;">ENREGISTREMENT</div>

  <!-- State 1: bars only, 420x64 as shipped -->
  <div style="width: 420px; height: 64px; background: rgba(12,16,22,0.90); border: 1px solid rgba(255,255,255,0.10); border-radius: 32px; display: flex; align-items: center;">
    <div style="font-size: 10px; font-weight: 600; color: {{accent}}; margin-left: 18px;">CLEAN</div>
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 4px; height: 32px; margin: 0 18px 0 10px;">
      <sc-for list="{{recBars}}" as="b" hint-placeholder-count="16">
        <div style="width: 4px; height: {{b.h}}px; border-radius: 99px; background: {{accent}}; opacity: {{b.o}};"></div>
      </sc-for>
    </div>
  </div>

  <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1.5px; color: #8b96a5; margin-top: 8px;">TRANSCRIPTION · APERÇU</div>

  <!-- State 2: shimmer + preview, 420x104 as shipped -->
  <div style="width: 420px; height: 104px; background: rgba(12,16,22,0.90); border: 1px solid rgba(255,255,255,0.10); border-radius: 32px; display: flex; flex-direction: column; justify-content: center;">
    <div style="display: flex; align-items: center;">
      <div style="font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.35); margin-left: 18px;">RAW</div>
      <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 4px; height: 32px; margin: 0 18px 0 10px;">
        <sc-for list="{{shimmerBars}}" as="b" hint-placeholder-count="16">
          <div style="width: 4px; height: {{b.h}}px; border-radius: 99px; background: #e8b44f;"></div>
        </sc-for>
      </div>
    </div>
    <div style="font-size: 13px; color: #e9edf2; text-align: center; margin: 2px 18px 0 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">…et le trajet distant reste prioritaire pour cette session.</div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#4fd8e8","options":["#4fd8e8","#5a8cf5","#4fe8a0","#f06ad8"],"section":"Theme"},"$preview":{"width":500,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.accent ?? '#4fd8e8';
    const rec = [], shim = [];
    for (let i = 0; i < 26; i++) {
      const v = Math.abs(Math.sin(i * 0.9 + 1.3)) * (0.4 + 0.6 * Math.abs(Math.sin(i * 0.23)));
      rec.push({ h: Math.round(4 + 28 * v), o: (0.35 + 0.65 * v).toFixed(2) });
      shim.push({ h: Math.round(8 + 8 * Math.sin(i * 0.45)) });
    }
    return { accent: a, recBars: rec, shimmerBars: shim };
  }
}
</script>
</body>
</html>
